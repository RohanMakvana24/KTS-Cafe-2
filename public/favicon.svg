<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE96E" />
      <stop offset="100%" stop-color="#FFDD17" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#050708" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge Rounded Square -->
  <rect width="128" height="128" rx="28" fill="#050708"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#goldGlow)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- "KT" Monogram -->
  <text x="64" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Poppins', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#050708" text-anchor="middle" letter-spacing="-2px">KT</text>
  
  <!-- Red Accent Dot -->
  <circle cx="100" cy="52" r="7" fill="#E01E25"/>
  
  <!-- Pure Veg Green Indicator Leaf / Dot -->
  <circle cx="64" cy="98" r="4.5" fill="#00843D"/>
</svg>
